# AZMARO – nginx reverse proxy
# Installed as /etc/nginx/sites-available/azmaro.conf (+ link in sites-enabled) on every deploy.
# certbot then adds the HTTPS (443) parts and the HTTP -> HTTPS redirect to that installed copy.
#
#   azmaro.dollara.tech        -> storefront  127.0.0.1:3000
#   admin.azmaro.dollara.tech  -> admin panel 127.0.0.1:3001
#   api.azmaro.dollara.tech    -> API         127.0.0.1:4000

# ── Storefront ───────────────────────────────────────────────────────
server {
    listen 80;
    server_name azmaro.dollara.tech;

    # Browser API calls (bag, checkout, account) go straight to the API on the same domain.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        include proxy_params;
    }

    # Product photos (including admin uploads) straight from disk.
    location /images/ {
        root /var/www/azmaro/web/public;
        try_files $uri @storefront;
        expires 7d;
    }

    location @storefront {
        proxy_pass http://127.0.0.1:3000;
        include proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include proxy_params;
    }
}

# ── Admin panel ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.azmaro.dollara.tech;
    client_max_body_size 10m;   # product photo uploads (max 8 MB)

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        include proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        include proxy_params;
    }
}

# ── API ──────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.azmaro.dollara.tech;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        include proxy_params;
    }
}
